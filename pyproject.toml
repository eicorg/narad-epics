[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narad-epics"
version = "0.1.0"
description = "Translate Narad accelerator descriptions into EPICS IOC databases"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
simulation = [
    "p4p>=4.2,<5.0",
    "pytao>=1.4,<2.0",
]

[project.scripts]
narad-epics-generate = "iocs.generate_db:main"
narad-epics-generate-opis = "iocs.opis.generate_opis:main"
narad-epics-machine-service = "iocs.pva_bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["iocs", "machines"]

[tool.hatch.build.targets.wheel.force-include]
"yaml-descriptions/toy_ring_narad_instance.yaml" = "yaml-descriptions/toy_ring_narad_instance.yaml"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.15"

[tool.pixi.pypi-dependencies]
narad-epics = { path = ".", editable = true }

[tool.pixi.environments]
simulation = ["simulation"]

[tool.pixi.tasks]
compile = "python -m compileall -q iocs machines tests"
test = "python -m unittest discover -s tests -v"
check = { depends-on = ["compile", "test"] }
generate-toy-ring = "narad-epics-generate yaml-descriptions/toy_ring_narad_instance.yaml --output generated/toy_ring.db"
generate-toy-ring-opis = "narad-epics-generate-opis yaml-descriptions/toy_ring_narad_instance.yaml --output iocs/opis/toy_ring_overview.bob"